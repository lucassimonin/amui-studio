name: Compte admin — changer le mot de passe

# Change le mot de passe d'un compte admin en production, sans accès SSH.
#
# Le nouveau mot de passe est lu dans le secret de dépôt ADMIN_PASSWORD
# (Settings → Secrets and variables → Actions → New repository secret).
# Il n'apparaît donc ni dans le formulaire, ni dans les logs : GitHub masque
# les secrets. Ne JAMAIS le passer en paramètre : sur un dépôt public,
# les paramètres d'exécution sont visibles par tout le monde.
#
# Après usage, pensez à supprimer le secret.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte à modifier"
        required: true
        default: 'admin@agence.fr'

concurrency:
  group: deploy-amui-studio
  cancel-in-progress: false

jobs:
  password:
    name: Changer le mot de passe
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le secret existe
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "::error::Secret ADMIN_PASSWORD absent. Créez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ ${#ADMIN_PASSWORD} -lt 12 ]; then
            echo "::error::Mot de passe trop court : 12 caractères minimum."
            exit 1
          fi

      - name: Appliquer sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          command_timeout: 10m
          envs: ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            COMPOSE_FILE="${{ secrets.DEPLOY_COMPOSE_FILE || 'compose.prod.yaml' }}"
            COMPOSE="docker compose --env-file .env.prod -f $COMPOSE_FILE -f compose.proxy.yaml"

            echo "→ Changement du mot de passe de $ADMIN_EMAIL"
            $COMPOSE exec -T app php bin/console app:user:password "$ADMIN_EMAIL" -p "$ADMIN_PASSWORD"
            echo "✓ Mot de passe changé. Supprimez maintenant le secret ADMIN_PASSWORD."
    env:
      ADMIN_EMAIL: ${{ inputs.email }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
